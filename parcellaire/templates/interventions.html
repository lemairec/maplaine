<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interventions – Gestion Parcellaire</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <style>
        body { background: #f8f9fa; }
        .type-badge { font-size: 0.78rem; padding: 2px 7px; border-radius: 3px; color: #fff; white-space: nowrap; }
        .type-Semis { background: #28a745; }
        .type-Traitement { background: #dc3545; }
        .type-Fertilisation { background: #fd7e14; }
        .type-Récolte { background: #ffc107; color: #333; }
        .type-Travail-du-sol { background: #6f4e37; }
        .type-Irrigation { background: #0dcaf0; }
        .type-Autre { background: #6c757d; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1"><i class="bi bi-journal-text"></i> Interventions</span>
    <div class="d-flex align-items-center gap-2">
        <a href="/" class="btn btn-sm btn-outline-light"><i class="bi bi-map"></i> Carte</a>
        <select id="sel-company" class="form-select form-select-sm bg-dark text-white border-secondary"></select>
        <select id="sel-campagne" class="form-select form-select-sm bg-dark text-white border-secondary"></select>
        <span id="nav-username" class="text-white small ms-2"></span>
        <button class="btn btn-sm btn-outline-light" id="btn-logout" title="Déconnexion"><i class="bi bi-box-arrow-right"></i></button>
    </div>
</nav>

<div class="container-fluid py-3 px-4">
    <!-- Toolbar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <h5 class="mb-0">Liste des interventions</h5>
            <span class="badge bg-secondary" id="interventions-count">0</span>
        </div>
        <div class="d-flex gap-2">
            <select class="form-select form-select-sm" id="filter-type" style="width:auto;">
                <option value="">Tous les types</option>
                <option value="Semis">Semis</option>
                <option value="Travail du sol">Travail du sol</option>
                <option value="Traitement">Traitement</option>
                <option value="Fertilisation">Fertilisation</option>
                <option value="Récolte">Récolte</option>
                <option value="Irrigation">Irrigation</option>
                <option value="Autre">Autre</option>
            </select>
            <button class="btn btn-sm btn-success" id="btn-add-intervention">
                <i class="bi bi-plus-lg"></i> Nouvelle intervention
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Nom / Description</th>
                        <th>Surface</th>
                        <th>Parcelles</th>
                        <th>Produits</th>
                        <th style="width:90px;"></th>
                    </tr>
                </thead>
                <tbody id="interventions-tbody">
                    <tr><td colspan="7" class="text-center text-muted py-4">Chargement…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal: New Intervention -->
<div class="modal fade" id="modal-intervention" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Nouvelle Intervention</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="form-intervention">
          <div class="row mb-2">
            <div class="col"><label class="form-label">Type</label>
              <select class="form-select" id="fi-type">
                <option value="Semis">Semis</option>
                <option value="Travail du sol">Travail du sol</option>
                <option value="Traitement">Traitement</option>
                <option value="Fertilisation">Fertilisation</option>
                <option value="Récolte">Récolte</option>
                <option value="Irrigation">Irrigation</option>
                <option value="Autre">Autre</option>
              </select>
            </div>
            <div class="col"><label class="form-label">Date</label><input class="form-control" id="fi-date" type="datetime-local" required /></div>
          </div>
          <div class="row mb-2">
            <div class="col"><label class="form-label">Nom / Description</label><input class="form-control" id="fi-name" /></div>
            <div class="col"><label class="form-label">Surface (ha)</label><input class="form-control" id="fi-surface" type="number" step="0.01" /></div>
          </div>
          <div class="mb-2"><label class="form-label">Commentaire</label><textarea class="form-control" id="fi-comment" rows="2"></textarea></div>
          <hr/>
          <h6>Parcelles concernées</h6>
          <div id="fi-parcelles" class="mb-2" style="max-height:200px; overflow-y:auto;"></div>
          <hr/>
          <h6>Produits utilisés</h6>
          <div id="fi-produits"></div>
          <button type="button" class="btn btn-sm btn-outline-secondary mt-1" id="btn-add-produit-row">
            <i class="bi bi-plus"></i> Ajouter un produit
          </button>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button class="btn btn-primary" id="btn-save-intervention">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = '';
let currentCompanyId = null;
let currentCampagneId = null;
let interventions = [];
let parcelles = [];
let produits = [];

async function api(url, opts = {}) {
    opts.headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    const resp = await fetch(API + url, opts);
    if (!resp.ok) throw new Error(`API ${resp.status}`);
    return resp.json();
}

function formatDate(dt) {
    if (!dt) return '—';
    return new Date(dt).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function formatHa(v) { return v != null ? v.toFixed(2) + ' ha' : '—'; }

function typeSlug(t) { return t.replace(/\s+/g, '-'); }

// ---- Init ----
document.getElementById('btn-logout').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
});

async function init() {
    const me = await api('/api/me');
    document.getElementById('nav-username').textContent = me.username;

    const allCompanies = await api('/api/companies');
    const companies = me.company_ids.length > 0
        ? allCompanies.filter(c => me.company_ids.includes(c.id))
        : allCompanies;

    const sel = document.getElementById('sel-company');
    sel.innerHTML = companies.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    if (companies.length > 0) {
        currentCompanyId = companies[0].id;
        await loadCampagnes();
    }
    sel.addEventListener('change', async () => {
        currentCompanyId = sel.value;
        await loadCampagnes();
    });
    document.getElementById('sel-campagne').addEventListener('change', async () => {
        currentCampagneId = document.getElementById('sel-campagne').value;
        await loadAll();
    });
}

async function loadCampagnes() {
    const campagnes = await api(`/api/companies/${currentCompanyId}/campagnes`);
    const sel = document.getElementById('sel-campagne');
    sel.innerHTML = campagnes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    if (campagnes.length > 0) {
        currentCampagneId = campagnes[0].id;
        await loadAll();
    }
}

async function loadAll() {
    [interventions, parcelles, produits] = await Promise.all([
        api(`/api/campagnes/${currentCampagneId}/interventions`),
        api(`/api/campagnes/${currentCampagneId}/parcelles`),
        api(`/api/companies/${currentCompanyId}/produits`),
    ]);
    renderTable();
}

// ---- Render ----
function renderTable() {
    const typeFilter = document.getElementById('filter-type').value;
    const filtered = typeFilter ? interventions.filter(i => i.type === typeFilter) : interventions;

    document.getElementById('interventions-count').textContent = filtered.length;

    const tbody = document.getElementById('interventions-tbody');
    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Aucune intervention</td></tr>';
        return;
    }

    tbody.innerHTML = filtered.map(i => {
        const parcelleNames = (i.parcelle_ids || []).map(pid => {
            const p = parcelles.find(x => x.id === pid);
            return p ? (p.complete_name || p.name || '?') : '?';
        }).join(', ') || '—';

        const produitsList = i.produits.map(pr => `${pr.name} ${pr.quantity} ${pr.unity || ''}`).join(', ') || '—';

        return `
        <tr>
            <td class="text-nowrap">${formatDate(i.datetime)}</td>
            <td><span class="type-badge type-${typeSlug(i.type)}">${i.type}</span></td>
            <td>${i.name || '<span class="text-muted">—</span>'}</td>
            <td class="text-nowrap">${formatHa(i.surface)}</td>
            <td class="small">${parcelleNames}</td>
            <td class="small">${produitsList}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary btn-edit-intervention" data-id="${i.id}" title="Modifier">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger btn-delete-intervention" data-id="${i.id}" title="Supprimer">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>`;
    }).join('');

    tbody.querySelectorAll('.btn-edit-intervention').forEach(btn => {
        btn.addEventListener('click', () => {
            const inter = interventions.find(i => i.id === btn.dataset.id);
            if (inter) openInterventionModal(inter);
        });
    });
    tbody.querySelectorAll('.btn-delete-intervention').forEach(btn => {
        btn.addEventListener('click', () => deleteIntervention(btn.dataset.id));
    });
}

document.getElementById('filter-type').addEventListener('change', renderTable);

// ---- CRUD ----
let editingInterventionId = null;

document.getElementById('btn-add-intervention').addEventListener('click', () => openInterventionModal(null));

function openInterventionModal(inter = null) {
    editingInterventionId = inter ? inter.id : null;
    document.querySelector('#modal-intervention .modal-title').textContent =
        inter ? 'Modifier l\'intervention' : 'Nouvelle Intervention';

    // Datetime: format for datetime-local input
    if (inter && inter.datetime) {
        const d = new Date(inter.datetime);
        document.getElementById('fi-date').value = d.toISOString().slice(0, 16);
    } else {
        document.getElementById('fi-date').value = new Date().toISOString().slice(0, 16);
    }

    document.getElementById('fi-type').value = inter ? inter.type : 'Semis';
    document.getElementById('fi-name').value = inter ? (inter.name || '') : '';
    document.getElementById('fi-surface').value = inter ? (inter.surface ?? '') : '';
    document.getElementById('fi-comment').value = inter ? (inter.comment || '') : '';

    const parcDiv = document.getElementById('fi-parcelles');
    parcDiv.innerHTML = parcelles.map(p => {
        const checked = inter && inter.parcelle_ids && inter.parcelle_ids.includes(p.id) ? 'checked' : '';
        return `
        <div class="form-check">
            <input class="form-check-input fi-parc-check" type="checkbox" value="${p.id}" id="fip-${p.id}" ${checked}>
            <label class="form-check-label" for="fip-${p.id}">${p.complete_name || p.name || '—'} (${formatHa(p.surface)})</label>
        </div>`;
    }).join('');

    parcDiv.querySelectorAll('.fi-parc-check').forEach(cb => {
        cb.addEventListener('change', () => {
            const checked = [...parcDiv.querySelectorAll('.fi-parc-check:checked')];
            const totalS = checked.reduce((s, c) => {
                const p = parcelles.find(x => x.id === c.value);
                return s + (p?.surface || 0);
            }, 0);
            document.getElementById('fi-surface').value = totalS.toFixed(2);
        });
    });

    document.getElementById('fi-produits').innerHTML = '';
    // Pre-fill existing produits when editing
    if (inter && inter.produits) {
        inter.produits.forEach(pr => addProduitRow(pr.produit_id, pr.quantity));
    }
    new bootstrap.Modal(document.getElementById('modal-intervention')).show();
}

document.getElementById('btn-add-produit-row').addEventListener('click', () => addProduitRow());

function addProduitRow(produitId = '', quantity = '') {
    const container = document.getElementById('fi-produits');
    const row = document.createElement('div');
    row.className = 'produit-row';
    row.innerHTML = `
        <select class="form-select form-select-sm fi-prod-sel">
            <option value="">— Produit —</option>
            ${produits.map(p => `<option value="${p.id}" data-name="${p.name}">${p.name} (${p.price}€/${p.unity || 'u'})</option>`).join('')}
        </select>
        <input class="form-control form-control-sm fi-prod-qty" type="number" step="0.01" placeholder="Quantité" />
        <button class="btn btn-sm btn-outline-danger fi-prod-del"><i class="bi bi-x"></i></button>
    `;
    row.querySelector('.fi-prod-sel').value = produitId;
    row.querySelector('.fi-prod-qty').value = quantity;
    row.querySelector('.fi-prod-del').addEventListener('click', () => row.remove());
    container.appendChild(row);
}

document.getElementById('btn-save-intervention').addEventListener('click', async () => {
    const checkedParcelles = [...document.querySelectorAll('.fi-parc-check:checked')].map(c => ({
        parcelle_id: c.value,
    }));

    const produitsData = [...document.querySelectorAll('.produit-row')].map(row => {
        const sel = row.querySelector('.fi-prod-sel');
        return {
            produit_id: sel.value,
            name: sel.options[sel.selectedIndex]?.dataset?.name || '',
            quantity: parseFloat(row.querySelector('.fi-prod-qty').value) || 0,
        };
    }).filter(p => p.produit_id);

    const payload = {
        datetime: document.getElementById('fi-date').value,
        type: document.getElementById('fi-type').value,
        surface: parseFloat(document.getElementById('fi-surface').value) || 0,
        name: document.getElementById('fi-name').value || null,
        comment: document.getElementById('fi-comment').value || null,
        parcelles: checkedParcelles,
        produits: produitsData,
    };

    if (editingInterventionId) {
        await api(`/api/interventions/${editingInterventionId}`, { method: 'PUT', body: JSON.stringify(payload) });
    } else {
        await api('/api/interventions', { method: 'POST', body: JSON.stringify({
            campagne_id: currentCampagneId,
            company_id: currentCompanyId,
            ...payload,
        }) });
    }
    editingInterventionId = null;
    bootstrap.Modal.getInstance(document.getElementById('modal-intervention')).hide();
    await loadAll();
});

async function deleteIntervention(id) {
    if (!confirm('Supprimer cette intervention ?')) return;
    await api(`/api/interventions/${id}`, { method: 'DELETE' });
    await loadAll();
}

init();
</script>
</body>
</html>
