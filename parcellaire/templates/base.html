<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestion Parcellaire{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand mb-0 h1 text-decoration-none" href="/"><i class="bi bi-map"></i> Gestion Parcellaire</a>
    <div class="d-flex align-items-center gap-2">
        <a href="/" class="btn btn-sm {% block nav_active_carte %}btn-outline-light{% endblock %}"><i class="bi bi-map"></i> Carte</a>
        <a href="/import" class="btn btn-sm {% block nav_active_import %}btn-outline-light{% endblock %}"><i class="bi bi-file-earmark-arrow-up"></i> Import</a>
        <a href="/interventions" class="btn btn-sm {% block nav_active_interventions %}btn-outline-light{% endblock %}"><i class="bi bi-journal-text"></i> Interventions</a>
        <div class="vr mx-1" style="opacity:.3;"></div>
        {% block navbar_selectors %}{% endblock %}
        <button class="btn btn-sm btn-outline-light" id="btn-logout" title="Déconnexion"><i class="bi bi-box-arrow-right"></i></button>
    </div>
</nav>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
