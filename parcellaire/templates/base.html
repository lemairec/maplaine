<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestion Parcellaire{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        .navbar-classic .navbar-brand {
            color: #1f2937;
            font-weight: 600;
        }
        .navbar-classic .nav-link {
            color: #4b5563;
            border-radius: 6px;
            padding: 0.4rem 0.75rem;
        }
        .navbar-classic .nav-link:hover {
            color: #111827;
            background: #f3f4f6;
        }
        .navbar-classic .nav-link.active {
            color: #0d6efd;
            background: #e9f2ff;
            font-weight: 600;
        }
        .navbar-classic .nav-controls {
            gap: 0.5rem;
        }
        .navbar-classic .nav-controls .form-select {
            min-width: 170px;
            background: #fff !important;
            color: #212529 !important;
            border-color: #ced4da !important;
        }
        .navbar-classic .nav-controls .text-white {
            color: #4b5563 !important;
            font-weight: 500;
        }

        @media (max-width: 991.98px) {
            .navbar-classic .nav-controls .form-select {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm navbar-classic">
    <div class="container-fluid px-3">
        <a class="navbar-brand mb-0 h1 text-decoration-none" href="/"><i class="bi bi-map"></i> Gestion Parcellaire</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a href="/" class="nav-link {% block nav_active_carte %}{% endblock %}"><i class="bi bi-map"></i> Carte</a>
                </li>
                <li class="nav-item">
                    <a href="/interventions" class="nav-link {% block nav_active_interventions %}{% endblock %}"><i class="bi bi-journal-text"></i> Interventions</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle {% block nav_active_advanced %}{% endblock %}" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-sliders"></i> Avancé
                    </a>
                    <ul class="dropdown-menu">
                        <li>
                            <a class="dropdown-item {% block nav_active_import_item %}{% endblock %}" href="/import">
                                <i class="bi bi-file-earmark-arrow-up"></i> Import TeléPAC
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item {% block nav_active_cahier_item %}{% endblock %}" href="/cahier-parcellaire">
                                <i class="bi bi-journal-richtext"></i> Cahier parcellaire
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>

            <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center nav-controls mt-2 mt-lg-0">
                {% block navbar_selectors %}{% endblock %}
                <button class="btn btn-sm btn-outline-secondary" id="btn-logout" title="Déconnexion"><i class="bi bi-box-arrow-right"></i></button>
            </div>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
